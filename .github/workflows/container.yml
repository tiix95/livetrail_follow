name: Build and publish container

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build container
        run: make build

      - name: Tag and push container
        run: |
          VERSION=$(make version)
          podman tag livetrail-follow:"$VERSION" ghcr.io/${{ github.repository }}:latest
          podman push ghcr.io/${{ github.repository }}:latest
